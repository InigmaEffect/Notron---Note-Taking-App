<style>
:root{
  --ease:cubic-bezier(.2,.9,.1,1);--dur:.74s;

  --mixa:#fff;--pillm:6%;--pillo:80%;--pa:4%;--mixb:#fff;--pb:7%;--pc:11%;
  --sh:0 22px 60px -14px rgba(0,0,0,.7),0 2px 10px rgba(0,0,0,.35);
  --fs:17px;--font-ui:"Red Rose",-apple-system,system-ui,sans-serif;--font-note:"Red Rose",-apple-system,system-ui,sans-serif;--font-head:Unbounded,"Red Rose",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --primary:#6a55ea;--secondary:#f6f6f9;--tertiary:#4b3cc4;--tx:#1a1b24;--mu:#757a8c;--danger:#e0384f;
  --mixa:#fff;--pillm:20%;--pa:70%;--mixb:#000;--pb:4.5%;--pc:9%;
  --sh:0 22px 55px -16px rgba(30,30,60,.3),0 2px 8px rgba(30,30,60,.08);color-scheme:light}}
:root[data-theme="light"]{
  --primary:#6a55ea;--secondary:#f6f6f9;--tertiary:#4b3cc4;--tx:#1a1b24;--mu:#757a8c;--danger:#e0384f;
  --mixa:#fff;--pillm:20%;--pa:70%;--mixb:#000;--pb:4.5%;--pc:9%;
  --sh:0 22px 55px -16px rgba(30,30,60,.3),0 2px 8px rgba(30,30,60,.08);color-scheme:light}
:root{
  --bg:var(--secondary);--ac:var(--primary);--ter:var(--tertiary);
  --s1:color-mix(in srgb,var(--secondary),var(--mixa) var(--pa));
  --s2:color-mix(in srgb,var(--secondary),var(--mixb) var(--pb));
  --s3:color-mix(in srgb,var(--secondary),var(--mixb) var(--pc));
  --line:color-mix(in srgb,var(--tx) 9%,transparent);
  --acs:color-mix(in srgb,var(--primary) 16%,transparent);
  --pill:color-mix(in srgb,color-mix(in srgb,var(--secondary),var(--mixa) var(--pillm)) var(--pillo),transparent);
  --pillb:color-mix(in srgb,var(--tx) 11%,transparent);
}
@media (prefers-reduced-motion:reduce){:root{--dur:.01s}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-bottom:180px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 calc(15px*var(--us,1))/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .4s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- note surface ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 4px) 6px 8px 16px;display:flex;align-items:center;gap:4px;background:linear-gradient(var(--bg) 60%,transparent)}
#tname{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0;cursor:pointer}
#tname b{display:block;font-size:calc(13.5px*var(--us,1));font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);letter-spacing:-.01em;line-height:1.25}
#tname small{display:block;font-size:calc(10.5px*var(--us,1));color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
#tbtns{display:flex;flex:none}
.tbtn2{width:34px;height:34px;border-radius:17px;border:0;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.tbtn2:active{background:var(--s2)}.tbtn2.on{color:var(--ac);background:var(--acs)}
#doc{overflow-x:clip;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 22px 260px;min-height:100dvh}
#docbox.slide-l{animation:sl .55s var(--ease)}#docbox.slide-r{animation:sr .55s var(--ease)}
@keyframes sl{from{opacity:0;transform:translateX(34px);filter:var(--rbf,blur(8px))}}@keyframes sr{from{opacity:0;transform:translateX(-34px);filter:var(--rbf,blur(8px))}}
#title{display:block;width:100%;border:0;background:none;color:var(--ter);font:800 calc(25px*var(--us,1))/1.25 var(--font-head);letter-spacing:-.02em;padding:6px 0 14px;outline:0}
#wys,#ed{font-family:var(--font-note);font-size:var(--fs);line-height:1.72}
#wys{outline:0;min-height:55vh;word-wrap:break-word;caret-color:var(--ac);-webkit-user-modify:read-write}
#ed{display:block;width:100%;border:0;background:none;resize:none;outline:0;padding:0;overflow:hidden;caret-color:var(--ac);min-height:55vh;font-family:"Geist Mono",ui-monospace,monospace;font-size:calc(var(--fs) - 2px);line-height:1.7;white-space:pre-wrap}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{letter-spacing:-.02em;line-height:1.25;margin:1.5em 0 .5em;font-weight:630;color:var(--ter)}
.md h1{font-size:var(--h1,1.4em)}.md h2{font-size:var(--h2,1.2em)}.md h3{font-size:var(--h3,1.06em)}.md h4{font-size:var(--h4,.96em);opacity:.8}.md h5{font-size:var(--h5,.9em);opacity:.8}.md h6{font-size:var(--h6,.85em);opacity:.8}
.md p,.md>div:not([class]){margin:.7em 0;min-height:1.72em}
.md ul,.md ol{padding-left:1.35em;margin:.5em 0}
.md li{margin:.2em 0}.md li::marker{color:var(--mu)}
.md li.task{list-style:none;position:relative;margin-left:-1.35em;padding-left:1.85em}
.md li.task::before{content:"";position:absolute;left:0;top:.42em;width:1.1em;height:1.1em;border-radius:.38em;border:1.6px solid var(--mu);transition:background .25s,border-color .25s;cursor:pointer}
.md li.task.done::before{background:var(--ac);border-color:var(--ac)}
.md li.task.done::after{content:"";position:absolute;left:.38em;top:.62em;width:.3em;height:.55em;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.md li.task.done{color:var(--mu)}
.md blockquote{margin:1em 0;padding:.05em 1em;border-left:3px solid var(--ac);color:var(--mu)}
.md code{font:500 .86em "Geist Mono",ui-monospace,monospace;background:var(--s2);padding:.15em .4em;border-radius:6px}
.md pre{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow-x:auto;margin:1em 0;white-space:pre-wrap}
.md pre code{background:none;padding:0;font-size:.85em;line-height:1.6;white-space:pre-wrap}
.md hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
.md mark{background:rgba(255,205,70,.28);color:inherit;padding:.05em .2em;border-radius:4px}
.md del{color:var(--mu)}
.md a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--acs);cursor:pointer}
.md a.un{color:var(--mu);border-bottom-style:dashed;border-color:var(--mu)}
.md a.tg{background:var(--acs);border:0;padding:.1em .55em;border-radius:99px;font-size:.88em;font-weight:500;color:var(--ter)}
.md .cm{color:var(--mu);font-style:italic;background:var(--s2);border-radius:5px;padding:0 .3em}
.md .tw{overflow-x:auto;margin:1em 0}
.md table{border-collapse:collapse;min-width:100%;font-size:.94em}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;min-width:64px}
.md th{color:var(--mu);font-weight:550}
.md .embed{margin:1em 0;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:12px;padding:6px 14px 10px;background:var(--s1);cursor:pointer;max-height:260px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.md .embed .et{font-weight:600;color:var(--ter);margin:4px 0}
#wys>p:only-child:has(>br:only-child)::before{content:"Start writing…  # heading · - list · [] task · **bold** · [[link]]";color:var(--mu);opacity:.6;position:absolute;pointer-events:none}
#props{margin:0 0 1.2em;padding:10px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:.8em;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;cursor:pointer}
#props span:nth-child(odd){color:var(--mu)}
.callout{margin:1em 0;border-radius:14px;padding:12px 14px;background:var(--acs)}
.callout .ct{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ter);font-size:.92em;-webkit-user-select:none;user-select:none}
.callout .cbd>*:first-child{margin-top:.4em}.callout .cbd>*:last-child{margin-bottom:0}
.callout[data-t=warning],.callout[data-t=danger]{background:rgba(255,120,100,.12)}
.callout[data-t=warning] .ct,.callout[data-t=danger] .ct{color:var(--danger)}
#empty{display:grid;place-items:center;text-align:center;min-height:64dvh;color:var(--mu)}
#empty h2{color:var(--tx);font-size:calc(22px*var(--us,1));margin:0 0 6px;letter-spacing:-.02em}#empty p{margin:0 0 18px}
.pbtn{border:0;background:var(--ac);color:var(--bg);font-weight:600;padding:12px 20px;border-radius:99px;cursor:pointer;margin:4px}
.pbtn.alt{background:var(--s2);color:var(--tx)}

/* ---------- the pill ---------- */
#scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 32%,transparent);backdrop-filter:blur(var(--bgb,22px)) saturate(1.3);-webkit-backdrop-filter:blur(var(--bgb,22px)) saturate(1.3);opacity:0;pointer-events:none;transition:opacity .45s ease}
body.ov #scrim{pointer-events:auto;opacity:var(--sp,1)}
#pill{--bh:62px;position:fixed;left:0;right:0;margin-inline:auto;bottom:12px;z-index:50;width:min(calc(100vw - 24px),440px);height:64px;border-radius:32px;
  background:var(--pill);backdrop-filter:blur(32px) saturate(1.8);-webkit-backdrop-filter:blur(32px) saturate(1.8);
  border:1px solid var(--pillb);box-shadow:var(--sh);overflow:hidden;
  transition:width var(--dur) var(--ease),height var(--dur) var(--ease),border-radius var(--dur) var(--ease),bottom var(--dur) var(--ease),transform .5s var(--ease)}
#pill.nudge-l{animation:nl .6s var(--ease)}#pill.nudge-r{animation:nr .6s var(--ease)}
@keyframes nl{30%{transform:translateX(-10px)}}@keyframes nr{30%{transform:translateX(10px)}}
#panel{position:absolute;left:0;right:0;bottom:var(--bh);height:0}
#grab{position:absolute;top:0;left:0;right:0;height:22px;z-index:3;touch-action:none;cursor:grab;opacity:0;transition:opacity .3s}
#grab i{position:absolute;left:50%;top:9px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--mu);opacity:.45}
#pill:not([data-s=nav]):not([data-s=edit]):not([data-s=editmore]):not([data-s=link]) #grab{opacity:1}
.view{position:absolute;left:0;bottom:0;width:100%;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(14px);filter:var(--rbf,blur(8px));transition:opacity .16s ease,transform .16s ease,filter .16s ease}
.view.full{top:var(--gh,22px)}
.view.on{opacity:1;pointer-events:auto;transform:none;filter:none;transition:opacity .5s ease .14s,transform .85s var(--ease) .08s,filter .7s ease .1s}
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--bh);touch-action:none}
.set{position:absolute;inset:0;display:flex;align-items:center;gap:2px;padding:0 8px;opacity:0;pointer-events:none;transition:opacity .14s}
.set.on{opacity:1;pointer-events:auto;transition:opacity .3s ease .08s}
.set>*{opacity:0;transform:scale(.55) translateY(8px);filter:var(--rbf5,blur(4px));transition:transform .15s,opacity .12s,filter .12s}
.set.on>*{opacity:1;transform:none;filter:none;transition:transform .8s var(--ease) calc(var(--i)*30ms + 50ms),opacity .35s ease calc(var(--i)*30ms + 50ms),filter .5s ease calc(var(--i)*30ms + 50ms)}
.b{flex:none;position:relative;width:46px;height:46px;border-radius:23px;display:grid;place-items:center;border:0;background:none;cursor:pointer;color:var(--tx)}
.b i{display:grid;place-items:center;transition:transform .5s var(--ease)}
.b:active{background:var(--s3)}.b:active i{transform:scale(.86)}
.b.ac{color:var(--ac)}.b.on{color:var(--ac);background:var(--acs)}.b.open i{transform:rotate(90deg)}
.b.danger{color:var(--danger)}
.b.t{width:auto;padding:0 12px;font-size:calc(14px*var(--us,1));font-weight:550;color:var(--mu);flex:1}
.b.t.sel{background:var(--acs);color:var(--ac)}
.b em{position:absolute;font-style:normal;font-size:calc(10.5px*var(--us,1));font-weight:650;left:0;right:0;top:50%;text-align:center;transform:translateY(-44%)}
.center{flex:1;min-width:0;width:auto;height:46px;border-radius:23px;background:var(--s2);flex-direction:column;gap:3px;padding:0 12px;display:flex;justify-content:center;align-items:center;overflow:hidden}
#ctitle{font-size:calc(14px*var(--us,1));font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
#ctitle.ts-l{animation:tsl .5s var(--ease)}#ctitle.ts-r{animation:tsr .5s var(--ease)}
@keyframes tsl{from{opacity:0;transform:translateX(18px);filter:var(--rbf6,blur(5px))}}@keyframes tsr{from{opacity:0;transform:translateX(-18px);filter:var(--rbf6,blur(5px))}}
#cdots{display:flex;gap:4px;height:4px}
#cdots i{width:4px;height:4px;border-radius:2px;background:var(--mu);opacity:.4;transition:width .5s var(--ease),opacity .3s,background .3s}
#cdots i.on{width:14px;opacity:1;background:var(--ac)}
.in{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--s2);border:0;padding:0 16px;color:var(--tx);font:500 calc(16px*var(--us,1)) var(--font-ui);outline:0;margin:0 2px}
.in::placeholder{color:var(--mu);font-weight:400}
.lab{flex:1;min-width:0;text-align:center;font-weight:600;font-size:calc(14.5px*var(--us,1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
/* mobile toolbar */
.set[data-set=edit]{padding:0 6px;gap:2px}
.bl{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;width:54px;height:86px;border-radius:20px;font-size:calc(10px*var(--us,1));color:var(--mu)}
.bl.dn{color:var(--ac);background:var(--acs)}
.tbs{flex:1;min-width:0;height:96px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 16px),transparent)}
.tbs::-webkit-scrollbar{display:none}
.tbg{display:grid;grid-template-rows:repeat(2,46px);grid-auto-flow:column;grid-auto-columns:58px;gap:2px;padding:1px 6px;width:max-content}
.tbb{border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx);cursor:pointer;padding:0;min-width:0}
.tbb span{font-size:calc(10px*var(--us,1));color:var(--mu);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbb:active{background:var(--s3)}
.gl{font:700 calc(13px*var(--us,1)) var(--font-ui);height:19px;display:grid;place-items:center;letter-spacing:-.02em}

/* panel content */
.list{overflow:auto;flex:1;overscroll-behavior:contain;padding:2px 8px 8px;-webkit-overflow-scrolling:touch}
.shead{flex:none;display:flex;align-items:center;gap:10px;margin:0 12px 6px;padding:0 6px 0 14px;height:46px;border-radius:23px;background:var(--s2);color:var(--mu)}
.shead input{flex:1;min-width:0;border:0;background:none;outline:0;font:500 calc(16px*var(--us,1)) var(--font-ui);color:var(--tx);height:100%}
.shead input::placeholder{color:var(--mu);font-weight:400}
.shead button{width:34px;height:34px;border-radius:17px;border:0;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;cursor:pointer}
.item:active,.item.sel{background:var(--s2)}
.item .fi{flex:none;width:34px;height:34px;border-radius:11px;background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.item.sel .fi,.item:active .fi{background:var(--s3)}
.item .fi.ac{background:var(--acs);color:var(--ac)}
.item .tx{min-width:0;flex:1}
.item b{display:block;font-weight:560;font-size:calc(15px*var(--us,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.item small{display:block;color:var(--mu);font-size:calc(12.5px*var(--us,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{margin:2px 0 0;color:var(--mu);font-size:calc(12.5px*var(--us,1));line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.sm{padding:6px 10px;gap:10px;border-radius:13px}.item.sm .fi{width:30px;height:30px;border-radius:9px}
.item .end{color:var(--mu);font-size:calc(12px*var(--us,1));flex:none}
.item.danger b,.item.danger .fi{color:var(--danger)}
mark.h{background:var(--acs);color:var(--ac);border-radius:3px;padding:0 1px}
.sec{padding:12px 14px 4px;color:var(--mu);font-size:calc(12.5px*var(--us,1));font-weight:550}
.meta{padding:2px 18px 6px;color:var(--mu);font-size:calc(12px*var(--us,1));min-height:20px;flex:none}
.opts{overflow:hidden;height:0;transition:height var(--dur) var(--ease),opacity .4s;opacity:0;flex:none}
.opts.open{opacity:1}
.in-wrap{padding:2px 14px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:0;background:var(--s2);color:var(--tx);border-radius:99px;padding:7px 13px;font-size:calc(13px*var(--us,1));font-weight:520;cursor:pointer;white-space:nowrap;flex:none}
.chip.sel{background:var(--acs);color:var(--ac)}.chip:active{background:var(--s3)}
.chip.dash{background:none;border:1px dashed var(--mu);color:var(--mu)}
.chiplab{align-self:center;color:var(--mu);font-size:calc(12px*var(--us,1));margin-right:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 12px 8px}
.tile{border:0;background:var(--s2);border-radius:18px;height:78px;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;font-size:calc(12px*var(--us,1));font-weight:520;cursor:pointer;color:var(--tx);transition:background .2s,transform .5s var(--ease)}
.tile:active{background:var(--s3);transform:scale(.95)}
.tile.dis{opacity:.35;pointer-events:none}.tile.acc{background:var(--acs);color:var(--ac)}.tile.dg{color:var(--danger)}
.tile.sm{height:62px;gap:4px;font-size:calc(10.5px*var(--us,1));border-radius:14px;position:relative}
.tile.sm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;color:var(--mu)}
.tile.sm.in::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:3px;background:var(--ac)}
#emBody{display:flex;flex-direction:column;flex:1;min-height:0}
#emBody .tiles{overflow:auto;flex:1;grid-template-columns:repeat(5,1fr);gap:6px;align-content:start;overscroll-behavior:contain;padding-bottom:12px}
.morebtn{margin:0 12px 6px;border:0;background:none;color:var(--mu);display:flex;justify-content:center;align-items:center;gap:6px;padding:9px;font-size:calc(13px*var(--us,1));font-weight:520;cursor:pointer;border-radius:14px}
.morebtn svg{transition:transform .6s var(--ease)}.morebtn.open svg{transform:rotate(180deg)}
.stepper{display:flex;align-items:center;gap:6px}

function gBuild(){
 const nm=nameMap(),E=new Set(),adj=new Map(),deg=new Map();
 for(const n of S.notes.values())for(const l of linksOf(n)){const t=nm.get(l.toLowerCase());if(t&&t!==n){const k=n.id<t.id?n.id+'|'+t.id:t.id+'|'+n.id;if(!E.has(k)){E.add(k);for(const [a,b] of [[n.id,t.id],[t.id,n.id]]){(adj.get(a)||adj.set(a,[]).get(a)).push(b);deg.set(a,(deg.get(a)||0)+1)}}}}
 const c=cur();let ids;
 if(G.local&&c){ids=new Set([c.id]);let fr=[c.id];for(let d=0;d<2;d++){const nx=[];for(const id of fr)for(const o of adj.get(id)||[])if(!ids.has(o)){ids.add(o);nx.push(o)}fr=nx}}
 else{let a=[...S.notes.values()].filter(n=>deg.get(n.id));a.sort((x,y)=>deg.get(y.id)-deg.get(x.id));a=a.slice(0,220);ids=new Set(a.map(n=>n.id));
  if(a.length<80)for(const n of S.notes.values()){if(ids.size>=90)break;ids.add(n.id)}}
 G.nodes=[...ids].map((id,i)=>{const n=S.notes.get(id),a=i/ids.size*Math.PI*2,r=60+Math.random()*80;return{id,n,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,d:deg.get(id)||0,cur:c&&c.id===id}});
 const idx=new Map(G.nodes.map((n,i)=>[n.id,i]));G.edges=[];
 for(const k of E){const [a,b]=k.split('|');if(idx.has(a)&&idx.has(b))G.edges.push([idx.get(a),idx.get(b)])}
 if(G.local&&c){const cn=G.nodes.find(n=>n.cur);if(cn){cn.x=0;cn.y=0}}
 G.alpha=1;G.s=1;G.tx=0;G.ty=0}
function gTick(){const N=G.nodes,a=G.alpha,n=N.length;
 for(let i=0;i<n;i++){const A1=N[i];for(let j=i+1;j<n;j++){const B=N[j];let dx=A1.x-B.x,dy=A1.y-B.y,d2=dx*dx+dy*dy+.5;if(d2>60000)continue;const d=Math.sqrt(d2),f=1500/d2*a;dx/=d;dy/=d;A1.vx+=dx*f;A1.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}}
 const L=G.local?70:46;
 for(const [i,j] of G.edges){const A1=N[i],B=N[j];const dx=B.x-A1.x,dy=B.y-A1.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-L)*.03*a;A1.vx+=dx/d*f;A1.vy+=dy/d*f;B.vx-=dx/d*f;B.vy-=dy/d*f}

 G.alpha*=.986}

  case'input':case'slider':case'select':case'toggle':{const v=it.v;if(typeof v==='string'&&v[0]==='=')return evalF(v,x);if(it.t==='toggle')return !!v;
   if(it.t==='select'||(it.t==='input'&&it.kind==='text'))return v==null?'':(nv(v)!=null&&it.t==='select'?nv(v):String(v));const n=nv(v);return n==null?0:n}
  case'display':return it.f?evalF(it.f,x):0;
  case'text':return tplStr(it.f,x);
  case'chart':return it.vf?evalF(it.vf,x):[];
  case'list':return listTitles(it,x);
  case'table':return{tbl:sc.tables.get(String(it.id).toLowerCase())};
  default:return null}}
/* ---------- vault queries ---------- */
function qNotes(q){q=String(q==null?'':q).trim();if(!q)return[];return search(q,'all',3000).list.map(r=>r.n)}
function listTitles(it,x){if(it.manual&&!it.ran)return[];const q=valOrF(it.q,x);if(Array.isArray(q))return q.map(str);return qNotes(q).map(titleOf)}
const noteArg=(v,x)=>{const s=str(v);const n=findByName(s);if(!n)E_('#REF!');return n};
/* ---------- function library ---------- */
const FN={};
const F=(c,name,s,d,e,f,lazy)=>{FN[name]={c,s,d,e,f,lazy:!!lazy}};
const flat=(v,o=[])=>{if(v instanceof FErr)throw v;if(Array.isArray(v)){for(const e of v)flat(e,o)}else if(v&&v.tbl)o.push(...tbAll(v.tbl));else o.push(v);return o};
const nums=args=>{const o=[];for(const a of args)for(const v of flat(a)){if(typeof v==='number')o.push(v);else if(typeof v==='string'){const n=parseNumStr(v);if(n!=null)o.push(n)}}return o};
const crit=c=>{if(typeof c==='number')return v=>nv(v)===c;const s=String(c),m=s.match(/^(>=|<=|<>|>|<|=)?([\s\S]*)$/),op=m[1]||'=',rhs=m[2],rn=parseNumStr(rhs);
 return v=>{const vn=nv(v);let a,b;if(rn!=null&&vn!=null){a=vn;b=rn}else{a=String(v==null?'':v).toLowerCase();b=rhs.toLowerCase();if((op==='='||op==='<>')&&/[*?]/.test(b)){const re=new RegExp('^'+b.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'),r=re.test(a);return op==='='?r:!r}}
  switch(op){case'=':return a===b;case'<>':return a!==b;case'>':return a>b;case'<':return a<b;case'>=':return a>=b;default:return a<=b}}};
const R2=(n,d)=>{const m=Math.pow(10,d);return Math.round((n+Number.EPSILON*Math.sign(n))*m)/m};
const rnd=()=>{rcount++;let t=(seed0*9301+rcount*49297)%233280;return Math.abs(Math.sin(t+seed0))%1};
const A1=a=>a.length?a[0]:undefined;
/* math */
F('Math','SUM','number1, [number2…]','Adds every number in the arguments or ranges.','=SUM(A1:A5)',a=>nums(a).reduce((s,v)=>s+v,0));
F('Math','AVERAGE','number1, [number2…]','Mean of the numbers.','=AVERAGE(Sales[Amount])',a=>{const n=nums(a);if(!n.length)E_('#DIV/0!');return n.reduce((s,v)=>s+v,0)/n.length});
F('Math','AVG','number1, …','Alias of AVERAGE.','=AVG(1,2,3)',a=>FN.AVERAGE.f(a));
F('Math','MIN','number1, …','Smallest number.','=MIN(B2:B9)',a=>{const n=nums(a);return n.length?Math.min(...n):0});
F('Math','MAX','number1, …','Largest number.','=MAX(B2:B9)',a=>{const n=nums(a);return n.length?Math.max(...n):0});
F('Math','COUNT','value1, …','How many numbers.','=COUNT(Sales[Qty])',a=>nums(a).length);
F('Math','COUNTA','value1, …','How many non-empty values.','=COUNTA(Sales[Item])',a=>a.flatMap(v=>flat(v)).filter(v=>v!==''&&v!=null).length);
F('Math','PRODUCT','number1, …','Multiplies the numbers.','=PRODUCT(2,3,4)',a=>nums(a).reduce((s,v)=>s*v,1));
F('Math','MEDIAN','number1, …','Middle value.','=MEDIAN(B2:B9)',a=>{const n=nums(a).sort((x,y)=>x-y);if(!n.length)E_('#NUM!');const m=n.length>>1;return n.length%2?n[m]:(n[m-1]+n[m])/2});
F('Math','STDEV','number1, …','Sample standard deviation.','=STDEV(B2:B9)',a=>{const n=nums(a);if(n.length<2)E_('#DIV/0!');const m=n.reduce((s,v)=>s+v,0)/n.length;return Math.sqrt(n.reduce((s,v)=>s+(v-m)**2,0)/(n.length-1))});
F('Math','ROUND','number, [digits]','Rounds to a number of decimals.','=ROUND(3.14159,2)',a=>lift1(v=>R2(toNum(v),a[1]==null?0:toNum(a[1])))(a[0]));
F('Math','ROUNDUP','number, [digits]','Rounds away from zero.','=ROUNDUP(2.1,0)',a=>{const m=Math.pow(10,a[1]==null?0:toNum(a[1]));return lift1(v=>Math.sign(toNum(v))*Math.ceil(Math.abs(toNum(v))*m-1e-9)/m)(a[0])});
F('Math','ROUNDDOWN','number, [digits]','Rounds toward zero.','=ROUNDDOWN(2.9,0)',a=>{const m=Math.pow(10,a[1]==null?0:toNum(a[1]));return lift1(v=>Math.sign(toNum(v))*Math.floor(Math.abs(toNum(v))*m+1e-9)/m)(a[0])});
F('Math','FLOOR','number','Rounds down.','=FLOOR(2.7)',a=>lift1(v=>Math.floor(toNum(v)))(a[0]));
F('Math','CEILING','number','Rounds up.','=CEILING(2.1)',a=>lift1(v=>Math.ceil(toNum(v)))(a[0]));
F('Math','INT','number','Integer part (rounds down).','=INT(-2.5)',a=>lift1(v=>Math.floor(toNum(v)))(a[0]));
F('Math','ABS','number','Absolute value.','=ABS(-5)',a=>lift1(v=>Math.abs(toNum(v)))(a[0]));
F('Math','SQRT','number','Square root.','=SQRT(81)',a=>lift1(v=>{const n=toNum(v);if(n<0)E_('#NUM!');return Math.sqrt(n)})(a[0]));
F('Math','POWER','base, exponent','Raises to a power.','=POWER(2,10)',a=>Math.pow(toNum(a[0]),toNum(a[1])));
F('Math','MOD','number, divisor','Remainder.','=MOD(10,3)',a=>{const d=toNum(a[1]);if(!d)E_('#DIV/0!');return toNum(a[0])%d});
F('Math','EXP','number','e to a power.','=EXP(1)',a=>Math.exp(toNum(a[0])));
F('Math','LN','number','Natural log.','=LN(10)',a=>Math.log(toNum(a[0])));
F('Math','LOG','number, [base]','Logarithm (base 10 default).','=LOG(1000)',a=>Math.log(toNum(a[0]))/Math.log(a[1]==null?10:toNum(a[1])));
F('Math','SIGN','number','-1, 0 or 1.','=SIGN(-4)',a=>Math.sign(toNum(a[0])));
F('Math','PI','','The number π.','=PI()*r^2',()=>Math.PI);
F('Math','RAND','','Random 0–1. Press a Recalculate button to change it.','=RAND()',()=>rnd());
F('Math','RANDBETWEEN','low, high','Random integer in range.','=RANDBETWEEN(1,6)',a=>{const lo=toNum(a[0]),hi=toNum(a[1]);return Math.floor(lo+rnd()*(hi-lo+1))});
F('Math','CLAMP','value, min, max','Limits a value to a range.','=CLAMP(score,0,100)',a=>Math.min(Math.max(toNum(a[0]),toNum(a[1])),toNum(a[2])));
F('Math','LERP','from, to, t','Blend between two numbers.','=LERP(10,20,0.5)',a=>toNum(a[0])+(toNum(a[1])-toNum(a[0]))*toNum(a[2]));
F('Math','SUMPRODUCT','array1, array2, …','Multiplies arrays then sums.','=SUMPRODUCT(Sales[Qty],Sales[Price])',a=>{const ar=a.map(v=>flat(v).map(toNum)),n=Math.min(...ar.map(r=>r.length));let s=0;for(let i=0;i<n;i++)s+=ar.reduce((p,r)=>p*r[i],1);return s});
F('Math','LARGE','array, k','k-th largest.','=LARGE(B2:B9,2)',a=>{const n=nums([a[0]]).sort((x,y)=>y-x),k=toNum(a[1]);if(k<1||k>n.length)E_('#NUM!');return n[k-1]});
F('Math','SMALL','array, k','k-th smallest.','=SMALL(B2:B9,1)',a=>{const n=nums([a[0]]).sort((x,y)=>x-y),k=toNum(a[1]);if(k<1||k>n.length)E_('#NUM!');return n[k-1]});
F('Math','CUMSUM','array','Running total as an array.','=CUMSUM(Sales[Amount])',a=>{let s=0;return flat(a[0]).map(v=>s+=toNum(v))});
/* logic */
F('Logic','IF','test, then, [else]','Chooses between two results.','=IF(A1>10,"big","small")',(a,x)=>{const t=ev(a[0],x);const b=Array.isArray(t)?t.every(Boolean):(typeof t==='string'?t!==''&&t.toLowerCase()!=='false':!!t);return b?ev(a[1],x):(a[2]?ev(a[2],x):false)},true);
F('Logic','IFS','test1, value1, test2, value2, …','First test that is true wins.','=IFS(A1>9,"A",A1>5,"B",TRUE,"C")',(a,x)=>{for(let i=0;i+1<a.length;i+=2)if(ev(a[i],x))return ev(a[i+1],x);E_('#N/A')},true);
F('Logic','AND','test1, …','All true.','=AND(A1>0,B1>0)',a=>a.flatMap(v=>flat(v)).every(Boolean));
F('Logic','OR','test1, …','Any true.','=OR(A1>0,B1>0)',a=>a.flatMap(v=>flat(v)).some(Boolean));
F('Logic','NOT','test','Flips true/false.','=NOT(A1>3)',a=>!a[0]);
F('Logic','IFERROR','value, fallback','Fallback when value is an error.','=IFERROR(A1/B1,0)',(a,x)=>{try{return ev(a[0],x)}catch(e){if(e instanceof FErr)return a[1]?ev(a[1],x):'';throw e}},true);
F('Logic','ISERROR','value','True if the value is an error.','=ISERROR(A1/0)',(a,x)=>{try{ev(a[0],x);return false}catch(e){if(e instanceof FErr)return true;throw e}},true);
F('Logic','ISNUMBER','value','True if numeric.','=ISNUMBER(A1)',a=>typeof a[0]==='number'||(typeof a[0]==='string'&&parseNumStr(a[0])!=null));
F('Logic','ISTEXT','value','True if text.','=ISTEXT(A1)',a=>typeof a[0]==='string'&&parseNumStr(a[0])==null);
F('Logic','ISBLANK','value','True if empty.','=ISBLANK(A1)',a=>a[0]===''||a[0]==null);
F('Logic','SWITCH','value, case1, result1, …, [default]','Matches a value to cases.','=SWITCH(s,"a",1,"b",2,0)',(a,x)=>{const v=ev(a[0],x);let i=1;for(;i+1<a.length;i+=2)if(eq(v,ev(a[i],x)))return ev(a[i+1],x);return i<a.length?ev(a[i],x):E_('#N/A')},true);
/* text */
F('Text','CONCAT','text1, …','Joins text.','=CONCAT("A",1)',a=>a.map(str).join(''));
F('Text','TEXTJOIN','separator, text1, …','Joins with a separator.','=TEXTJOIN(", ",Sales[Item])',a=>a.slice(1).flatMap(v=>flat(v)).map(str).join(str(a[0])));
F('Text','TEXT','value, format','Formats a number: "0.00", "$#,##0", "0%".','=TEXT(A1,"$#,##0.00")',a=>{const n=toNum(a[0]),f=str(a[1]),d=(f.split('.')[1]||'').replace(/[^0#]/g,'').length,pct=f.includes('%'),th=f.includes(','),pre=(f.match(/^[^0#,.]*/)||[''])[0],suf=pct?'%':'';const v=pct?n*100:n;const s=th?v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):v.toFixed(d);return pre+s+suf});
F('Text','LEN','text','Length of text.','=LEN("hello")',a=>str(a[0]).length);
F('Text','UPPER','text','Uppercase.','=UPPER(A1)',a=>str(a[0]).toUpperCase());
F('Text','LOWER','text','Lowercase.','=LOWER(A1)',a=>str(a[0]).toLowerCase());
F('Text','PROPER','text','Capitalise Each Word.','=PROPER("hi there")',a=>str(a[0]).replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()));
F('Text','LEFT','text, [n]','First characters.','=LEFT(A1,3)',a=>str(a[0]).slice(0,a[1]==null?1:toNum(a[1])));
F('Text','RIGHT','text, [n]','Last characters.','=RIGHT(A1,3)',a=>{const s=str(a[0]),n=a[1]==null?1:toNum(a[1]);return n?s.slice(-n):''});
F('Text','MID','text, start, length','Middle characters.','=MID(A1,2,3)',a=>str(a[0]).substr(toNum(a[1])-1,toNum(a[2])));
F('Text','TRIM','text','Removes extra spaces.','=TRIM(A1)',a=>str(a[0]).trim().replace(/\s+/g,' '));
F('Text','SUBSTITUTE','text, old, new','Replaces text.','=SUBSTITUTE(A1,"a","b")',a=>str(a[0]).split(str(a[1])).join(str(a[2])));
F('Text','REPT','text, times','Repeats text.','=REPT("★",rating)',a=>str(a[0]).repeat(Math.max(0,toNum(a[1]))));
F('Text','CONTAINS','text, part','True if text contains part.','=CONTAINS(A1,"x")',a=>str(a[0]).toLowerCase().includes(str(a[1]).toLowerCase()));
F('Text','VALUE','text','Text to number.','=VALUE("12.5")',a=>toNum(a[0]));
F('Text','CURRENCY','number, [symbol]','Formats as money.','=CURRENCY(total,"€")',a=>(a[1]==null?'$':str(a[1]))+nfmt(toNum(a[0]),2));
F('Text','PERCENT','number, [decimals]','0.256 → 25.6%.','=PERCENT(0.256,1)',a=>nfmt(toNum(a[0])*100,a[1]==null?1:toNum(a[1]))+'%');
/* lookup & arrays */
F('Lookup','INDEX','array, position','Item at a position (1-based).','=INDEX(Sales[Item],2)',a=>{const r=flat(a[0]),i=toNum(a[1]);if(i<1||i>r.length)E_('#REF!');return r[i-1]});
F('Lookup','MATCH','value, array','Position of a value.','=MATCH("Pens",Sales[Item])',a=>{const r=flat(a[1]),i=r.findIndex(v=>eq(v,a[0]));if(i<0)E_('#N/A');return i+1});
F('Lookup','LOOKUP','value, keys, results','Finds a key and returns the matching result.','=LOOKUP("Pens",Sales[Item],Sales[Price])',a=>{const k=flat(a[1]),r=flat(a[2]),i=k.findIndex(v=>eq(v,a[0]));if(i<0)E_('#N/A');return r[i]});
F('Lookup','XLOOKUP','value, keys, results, [if missing]','Same as LOOKUP with a fallback.','=XLOOKUP(x,keys,vals,0)',a=>{const k=flat(a[1]),r=flat(a[2]),i=k.findIndex(v=>eq(v,a[0]));if(i<0){if(a[3]!==undefined)return a[3];E_('#N/A')}return r[i]});
F('Lookup','SUMIF','range, criteria, [sum_range]','Sums values that match a rule.','=SUMIF(Sales[Product],"Alpha",Sales[Amount])',a=>{const r=flat(a[0]),s=a[2]!==undefined?flat(a[2]):r,p=crit(a[1]);return r.reduce((t,v,i)=>p(v)?t+(nv(s[i])||0):t,0)});
F('Lookup','COUNTIF','range, criteria','Counts matches.','=COUNTIF(Sales[Qty],">5")',a=>{const p=crit(a[1]);return flat(a[0]).filter(p).length});
F('Lookup','AVERAGEIF','range, criteria, [avg_range]','Average of matches.','=AVERAGEIF(A,">0")',a=>{const r=flat(a[0]),s=a[2]!==undefined?flat(a[2]):r,p=crit(a[1]),m=r.map((v,i)=>p(v)?nv(s[i]):null).filter(v=>v!=null);if(!m.length)E_('#DIV/0!');return m.reduce((t,v)=>t+v,0)/m.length});
F('Lookup','SUMIFS','sum_range, range1, crit1, …','Sums with several rules.','=SUMIFS(amt,prod,"Alpha",qty,">1")',a=>{const s=flat(a[0]);let ok=s.map(()=>true);for(let i=1;i+1<a.length;i+=2){const r=flat(a[i]),p=crit(a[i+1]);ok=ok.map((o,j)=>o&&p(r[j]))}return s.reduce((t,v,j)=>ok[j]?t+(nv(v)||0):t,0)});
F('Lookup','COUNTIFS','range1, crit1, …','Counts with several rules.','=COUNTIFS(prod,"Alpha",qty,">1")',a=>{let ok=null;for(let i=0;i+1<a.length;i+=2){const r=flat(a[i]),p=crit(a[i+1]);ok=(ok||r.map(()=>true)).map((o,j)=>o&&p(r[j]))}return ok?ok.filter(Boolean).length:0});
F('Lookup','UNIQUE','array','Distinct values.','=UNIQUE(Sales[Product])',a=>{const seen=new Set(),o=[];for(const v of flat(a[0])){const k=str(v);if(!seen.has(k)){seen.add(k);o.push(v)}}return o});
F('Lookup','SORT','array, [descending]','Sorted copy.','=SORT(Sales[Amount],TRUE)',a=>flat(a[0]).slice().sort(cmp).sort(()=>0).sort((x,y)=>(a[1]?-1:1)*cmp(x,y)));
F('Lookup','TOPN','array, n','Largest n numbers.','=TOPN(Sales[Amount],3)',a=>nums([a[0]]).sort((x,y)=>y-x).slice(0,toNum(a[1])));
F('Lookup','SLICE','array, start, [length]','Part of an array.','=SLICE(Sales[Item],1,3)',a=>flat(a[0]).slice(toNum(a[1])-1,a[2]==null?undefined:toNum(a[1])-1+toNum(a[2])));
F('Lookup','FILTER','values, keys, criteria','Values whose key matches.','=FILTER(Sales[Amount],Sales[Product],"Alpha")',a=>{const v=flat(a[0]),k=flat(a[1]),p=crit(a[2]);return v.filter((_,i)=>p(k[i]))});
F('Lookup','LIST','value1, …','Builds an array.','=LIST(1,2,3)',a=>a.flatMap(v=>Array.isArray(v)?v:[v]));
F('Lookup','SEQUENCE','count, [start], [step]','Number sequence.','=SEQUENCE(5,1,2)',a=>Array.from({length:toNum(a[0])},(_,i)=>(a[1]==null?1:toNum(a[1]))+i*(a[2]==null?1:toNum(a[2]))));
F('Lookup','REVERSE','array','Reversed array.','=REVERSE(Sales[Item])',a=>flat(a[0]).slice().reverse());
F('Lookup','ROWS','table or array','Number of rows or items.','=ROWS(Sales)',a=>a[0]&&a[0].tbl?a[0].tbl.nrows:flat(a[0]).length);
F('Lookup','COLS','table','Number of columns.','=COLS(Sales)',a=>a[0]&&a[0].tbl?a[0].tbl.ncols:1);
F('Lookup','ROW','','Row number of the current table row.','=ROW()',(a,x)=>{if(x.ri==null||!x.tbl)E_('#VALUE!');return x.ri+1});

F('Finance','PMT','rate, periods, principal','Loan payment per period.','=PMT(0.05/12,360,-200000)',a=>{const r=toNum(a[0]),n=toNum(a[1]),pv=toNum(a[2]);return r===0?-pv/n:-(pv*r)/(1-Math.pow(1+r,-n))*-1*-1*-1});
F('Finance','FV','rate, periods, payment, [pv]','Future value.','=FV(0.05,10,-100)',a=>{const r=toNum(a[0]),n=toNum(a[1]),p=toNum(a[2]),pv=a[3]==null?0:toNum(a[3]);return r===0?-(pv+p*n):-(pv*Math.pow(1+r,n)+p*(Math.pow(1+r,n)-1)/r)});
F('Finance','PV','rate, periods, payment','Present value.','=PV(0.05,10,-100)',a=>{const r=toNum(a[0]),n=toNum(a[1]),p=toNum(a[2]);return r===0?-p*n:-p*(1-Math.pow(1+r,-n))/r});
F('Finance','NPV','rate, cash1, …','Net present value.','=NPV(0.1,B2:B6)',a=>{const r=toNum(a[0]);return nums(a.slice(1)).reduce((s,v,i)=>s+v/Math.pow(1+r,i+1),0)});
F('Finance','IRR','cashflows','Internal rate of return.','=IRR(B2:B7)',a=>{const c=nums(a);let lo=-.99,hi=10;const f=r=>c.reduce((s,v,i)=>s+v/Math.pow(1+r,i),0);if(f(lo)*f(hi)>0)E_('#NUM!');for(let i=0;i<100;i++){const m=(lo+hi)/2;f(lo)*f(m)<=0?hi=m:lo=m}return (lo+hi)/2});
F('Finance','MARGIN','price, cost','(price − cost) ÷ price.','=MARGIN(price,cost)',a=>{const p=toNum(a[0]);if(!p)E_('#DIV/0!');return (p-toNum(a[1]))/p});
F('Finance','MARKUP','price, cost','(price − cost) ÷ cost.','=MARKUP(price,cost)',a=>{const c=toNum(a[1]);if(!c)E_('#DIV/0!');return (toNum(a[0])-c)/c});

F('Finance','GROWTH','from, to','Percent change.','=GROWTH(100,125)',a=>{const f=toNum(a[0]);if(!f)E_('#DIV/0!');return (toNum(a[1])-f)/f});
F('Finance','DISCOUNT','price, percent','Price after a percent discount.','=DISCOUNT(80,15)',a=>toNum(a[0])*(1-toNum(a[1])/100));
